[package]
name = "caidex-model-gateway"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
axum = { version = "=0.8.9", default-features = false, features = ["http1", "tokio"] }
caidex-credentials = { path = "../../credentials/core", default-features = false }
caidex-model-core = { path = "../core" }
caidex-provider-custom = { path = "../providers/custom" }
futures-util = "=0.3.34"
getrandom = "=0.4.3"
serde_json.workspace = true
subtle = "=2.6.1"
thiserror.workspace = true
tokio = { workspace = true, features = ["net"] }

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
httpdate = "=1.0.3"
