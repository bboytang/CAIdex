[package]
name = "caidex-provider-google"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
caidex-credentials = { path = "../../../credentials/core", default-features = false }
caidex-model-core = { path = "../../core" }
caidex-provider-custom = { path = "../custom" }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "stream"] }
futures-util = "=0.3.34"
getrandom = "=0.4.3"
base64 = "=0.22.1"
sha2 = "=0.10.9"
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true

[dev-dependencies]
caidex-model-gateway = { path = "../../gateway" }
tokio = { workspace = true, features = ["net"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs"] }
rustls = { version = "=0.23.45", default-features = false, features = ["aws_lc_rs"] }
time = "=0.3.47"
tokio-rustls = "=0.26.6"
