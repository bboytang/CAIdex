[workspace]
members = ["cloud/core", "runtime/bridge", "runtime/host", "apps/cli", "credentials/core", "model/core", "model/gateway", "model/providers/custom", "model/providers/chat-completions", "model/providers/openai", "model/providers/anthropic", "model/providers/google", "model/providers/ollama", "model/providers/deepseek", "model/providers/qwen", "model/providers/openrouter"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.99"

[workspace.dependencies]
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
thiserror = "=2.0.21"
tokio = { version = "=1.53.2", features = ["io-util", "macros", "process", "rt-multi-thread", "sync", "time"] }
