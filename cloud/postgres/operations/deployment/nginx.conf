limit_req_zone $binary_remote_addr zone=caidex_client:1m rate=1r/s;
limit_req_zone $server_name zone=caidex_total:1m rate=2r/s;
limit_conn_zone $binary_remote_addr zone=caidex_connections:1m;
log_format caidex '$time_iso8601 $remote_addr $request_method $uri $status $request_time';

server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;
    access_log off;
    error_log /var/log/nginx/caidex-error.log crit;
    return 444;
}
server {
    listen 80;
    listen [::]:80;
    server_name caidex.cn www.caidex.cn;
    access_log off;
    error_log /var/log/nginx/caidex-error.log crit;
    location ^~ /.well-known/acme-challenge/ { root /var/lib/letsencrypt; }
    location / { return 308 https://caidex.cn$request_uri; }
}
server {
    listen 443 ssl default_server;
    listen [::]:443 ssl default_server;
    ssl_reject_handshake on;
    access_log off;
    error_log /var/log/nginx/caidex-error.log crit;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.caidex.cn;
    access_log off;
    error_log /var/log/nginx/caidex-error.log crit;
    ssl_certificate /etc/letsencrypt/live/caidex.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caidex.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    return 308 https://caidex.cn$request_uri;
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name caidex.cn;
    ssl_certificate /etc/letsencrypt/live/caidex.cn/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/caidex.cn/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    server_tokens off;
    access_log /var/log/nginx/caidex-access.log caidex;
    error_log /var/log/nginx/caidex-error.log crit;
    add_header Strict-Transport-Security 'max-age=31536000' always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control no-store always;
    client_max_body_size 12m;
    client_body_timeout 10s;
    client_header_timeout 10s;
    limit_req zone=caidex_client burst=10 nodelay;
    limit_req zone=caidex_total burst=20 nodelay;
    limit_req_status 429;
    limit_conn caidex_connections 10;
    limit_conn_status 429;
    location = / { return 303 /authorize; }
    location / {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host caidex.cn;
        proxy_set_header Connection '';
        proxy_set_header X-Forwarded-For '';
        proxy_set_header X-Real-IP '';
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_connect_timeout 2s;
        proxy_read_timeout 15s;
        proxy_send_timeout 10s;
    }
}
