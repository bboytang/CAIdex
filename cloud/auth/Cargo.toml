[package]
name = "caidex-auth"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[features]
default = []
server = ["dep:serde_urlencoded", "dep:hmac", "dep:argon2", "dep:axum", "dep:tokio", "dep:tokio-postgres", "dep:webauthn-rs"]
test-auth = ["server", "dep:webauthn-authenticator-rs"]

[dependencies]
argon2 = { version = "=0.5.3", optional = true }
axum = { optional = true, version = "=0.8.9", default-features = false, features = ["http1", "tokio", "json", "query", "form"] }
base64 = "=0.22.1"
caidex-credentials = { path = "../../credentials/core", default-features = false }
caidex-cloud-core = { path = "../core" }
hmac = { version = "=0.12.1", optional = true }
getrandom = "=0.4.3"
oauth2 = { version = "=5.0.0", default-features = false }
serde.workspace = true
serde_json.workspace = true
serde_urlencoded = { version = "=0.7.1", optional = true }
sha2 = "=0.10.9"
subtle = "=2.6.1"
thiserror.workspace = true
tokio = { optional = true, workspace = true, features = ["net", "signal"] }
tokio-postgres = { optional = true, version = "=0.7.18", features = ["with-serde_json-1", "with-uuid-1"] }
url = "=2.5.8"
zeroize = "=1.9.0"
uuid = { version = "=1.23.0", features = ["v4", "serde"] }
webauthn-rs = { optional = true, version = "=0.5.5", features = ["danger-allow-state-serialisation"] }

webauthn-authenticator-rs = { optional = true, version = "=0.5.5", default-features = false, features = ["softpasskey"] }


[[bin]]
name = "caidex-auth-local"
path = "src/main.rs"
required-features = ["server"]

[dev-dependencies]
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls"] }
