<!doctype html>
<html lang="{{language}}">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{subject}}</title></head>
<body style="margin:0;background:#f4f5f8;color:#172033;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',Arial,sans-serif">
  <div style="display:none;max-height:0;overflow:hidden;opacity:0">{{intro}}</div>
  <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#f4f5f8"><tr><td align="center" style="padding:40px 16px">
    <table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="max-width:520px"><tr><td style="padding:0 8px 22px;font-size:20px;font-weight:700;letter-spacing:3px;color:#172033">CAIDEX <span style="font-size:10px;font-weight:500;letter-spacing:1px;color:#7b8496">{{eyebrow}}</span></td></tr>
      <tr><td style="background:#fff;border:1px solid #e4e7ee;border-radius:16px;padding:36px 28px">
        <div style="width:32px;height:3px;background:#5367ea;border-radius:2px;margin-bottom:24px"></div>
        <h1 style="margin:0 0 14px;font-size:25px;line-height:1.4;font-weight:650;letter-spacing:-.5px">{{headline}}</h1>
        <p style="margin:0 0 26px;color:#626d80;font-size:15px;line-height:1.8">{{intro}}</p>
        {{code_block}}
        <p style="margin:26px 0 0;padding-top:22px;border-top:1px solid #eceef3;color:#8991a1;font-size:12px;line-height:1.8">{{notice}}</p>
      </td></tr>
      <tr><td align="center" style="padding:22px 16px;color:#969dab;font-size:11px;line-height:1.8">{{footer}}<br>CAIDEX · no-reply@caidex.cn</td></tr>
    </table>
  </td></tr></table>
</body></html>
