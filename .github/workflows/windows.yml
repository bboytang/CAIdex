name: J-1 Windows application
on:
  push:
    branches: [main]
    paths: [apps/windows/**, chat/**, credentials/**, model/**, .github/workflows/windows.yml, scripts/j1-windows.py]
  pull_request:
    paths: [apps/windows/**, chat/**, credentials/**, model/**, .github/workflows/windows.yml, scripts/j1-windows.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  frontend:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apps/windows
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: 22.23.3}
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: j1-renderer-evidence-${{ github.sha }}
          path: apps/windows/test-results
          retention-days: 30
  windows:
    runs-on: windows-2022
    timeout-minutes: 60
    defaults:
      run:
        working-directory: apps/windows
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_PROFILE_DEV_DEBUG: 0
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with: {persist-credentials: false}
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with: {node-version: 22.23.3}
      - run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - run: cargo fmt --manifest-path src-tauri/Cargo.toml -- --check
      - run: cargo clippy --manifest-path src-tauri/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path src-tauri/Cargo.toml --locked
      - name: Build actual release executable and NSIS/MSI installers
        run: npm run tauri -- build -- --locked
      - name: Install pinned native WebDriver tools
        run: |
          cargo install tauri-driver --version 2.1.0 --locked
          cargo install --git https://github.com/chippers/msedgedriver-tool --rev 8c4b34f51b45f5cf08013366d703de464ab871d1 --locked
          & "$env:USERPROFILE/.cargo/bin/msedgedriver-tool.exe"
      - name: Real Windows WebView IPC, synthetic Chat, preferences and installer lifecycle
        run: python ../../scripts/j1-windows.py --binary src-tauri/target/release/CAIdex.exe --driver "$env:USERPROFILE/.cargo/bin/tauri-driver.exe" --native-driver msedgedriver.exe --output test-results/native.json
      - name: Manifest and installer SHA256
        run: |
          $sha = git rev-parse HEAD
          $files = Get-ChildItem src-tauri/target/release/bundle -Recurse -File | Where-Object { $_.Extension -in '.exe','.msi' }
          if (($files | Measure-Object).Count -lt 2) { throw 'Missing actual NSIS/MSI installers' }
          $manifest = @{ source_sha=$sha; runner='windows-2022'; signed=$false; files=@($files | ForEach-Object { @{name=$_.Name;bytes=$_.Length;sha256=(Get-FileHash $_.FullName -Algorithm SHA256).Hash.ToLower()} }) }
          $manifest | ConvertTo-Json -Depth 5 | Set-Content test-results/build-manifest.json
          Copy-Item test-results/build-manifest.json src-tauri/target/release/bundle/build-manifest.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: j1-native-evidence-${{ github.sha }}
          path: apps/windows/test-results
          retention-days: 30
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: CAIdex-Windows-x64-${{ github.sha }}
          path: |
            apps/windows/src-tauri/target/release/bundle/nsis/*.exe
            apps/windows/src-tauri/target/release/bundle/msi/*.msi
            apps/windows/src-tauri/target/release/bundle/build-manifest.json
          if-no-files-found: error
          retention-days: 30
