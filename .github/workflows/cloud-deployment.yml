name: Build verified cloud deployment

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: 2
      CARGO_INCREMENTAL: 0
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          ref: b1abed54748de3456204d63b449729b34c027c4c
          persist-credentials: false
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal
      - name: Build production service without test fixtures
        run: cargo build --release -p caidex-auth --features server --bin caidex-auth-service --locked
      - name: Package immutable source and production binary
        run: |
          test "$(git rev-parse HEAD)" = b1abed54748de3456204d63b449729b34c027c4c
          git clone --depth 1 --no-hardlinks "file://$PWD" "$RUNNER_TEMP/caidex-release"
          git -C "$RUNNER_TEMP/caidex-release" remote set-url origin https://github.com/bboytang/CAIdex.git
          mkdir "$RUNNER_TEMP/caidex-release/bin"
          install -m 0755 target/release/caidex-auth-service "$RUNNER_TEMP/caidex-release/bin/caidex-auth-service"
          cd "$RUNNER_TEMP/caidex-release"
          sha256sum bin/caidex-auth-service > BINARY_SHA256SUMS
          tar -czf "$RUNNER_TEMP/caidex-cloud-b1abed5.tar.gz" .
          cd "$RUNNER_TEMP"
          sha256sum caidex-cloud-b1abed5.tar.gz > caidex-cloud-b1abed5.tar.gz.sha256
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: caidex-cloud-b1abed5
          path: |
            ${{ runner.temp }}/caidex-cloud-b1abed5.tar.gz
            ${{ runner.temp }}/caidex-cloud-b1abed5.tar.gz.sha256
          if-no-files-found: error
          retention-days: 7
