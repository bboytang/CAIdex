name: Foundation CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - runtime/**
      - apps/**
      - scripts/**
      - upstream/codex/**
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2022
            python: python
          - os: macos-15
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CAIDEX_TEST_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Protocol tests
        run: cargo test --workspace --locked
      - name: Install pinned upstream CLI
        run: npm install --prefix .tools/codex --no-audit --no-fund --ignore-scripts @openai/codex@0.160.1
      - name: Locate native Codex executable
        run: node scripts/codex-binary.mjs --github-env
      - name: Verify real app-server without a model turn
        run: cargo run -p caidex-cli --locked -- doctor
