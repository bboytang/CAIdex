name: Foundation CI

on:
  push:
    branches: [main]
    paths:
      - Cargo.toml
      - Cargo.lock
      - rust-toolchain.toml
      - .gitattributes
      - runtime/**
      - credentials/**
      - model/**
      - cloud/**
      - apps/**
      - scripts/**
      - upstream/codex/**
      - .github/workflows/**
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  database:
    name: I-1 PostgreSQL permissions (Linux)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - name: Pull pinned PostgreSQL and pgvector test image
        run: docker pull pgvector/pgvector@sha256:feb68f4f15446397d8cac7f4fe48fe4586de83160d1fc48b46283312d1a33966
      - name: Rebuild and verify real database isolation and failure paths
        run: python3 scripts/i1-database.py --output i1-database.json

  runtime:
    name: Runtime (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: python3
          - os: windows-2022
            python: python
          - os: macos-15
            python: python3
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    env:
      CAIDEX_TEST_PYTHON: ${{ matrix.python }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22.23.3
      - name: Windows Host owner-only storage boundary
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $source = Get-Content runtime/host/src/security.rs -Raw
          $script = [regex]::Match($source, '(?s)r#"(.*?)"#').Groups[1].Value
          if (!$script) { throw 'Missing production ACL script' }
          $env:CAIDEX_PRIVATE_DIRECTORY = Join-Path $env:TEMP ('caidex-h1-acl-' + [guid]::NewGuid())
          try {
            & powershell.exe -NoProfile -NonInteractive -Command $script
            if ($LASTEXITCODE) { throw "New private directory failed at ACL step $LASTEXITCODE" }
            & powershell.exe -NoProfile -NonInteractive -Command $script
            if ($LASTEXITCODE) { throw "Existing private directory failed at ACL step $LASTEXITCODE" }
            $acl = Get-Acl -LiteralPath $env:CAIDEX_PRIVATE_DIRECTORY
            $acl.SetAccessRuleProtection($false, $true)
            Set-Acl -LiteralPath $env:CAIDEX_PRIVATE_DIRECTORY -AclObject $acl
            & powershell.exe -NoProfile -NonInteractive -Command $script
            if ($LASTEXITCODE -ne 22) { throw 'Inherited ACL was not rejected' }
            Write-Output 'Owner-only storage create/reopen and unsafe inheritance rejection passed'
          } finally {
            if (Test-Path -LiteralPath $env:CAIDEX_PRIVATE_DIRECTORY) {
              Remove-Item -LiteralPath $env:CAIDEX_PRIVATE_DIRECTORY -Recurse -Force
            }
          }
          $global:LASTEXITCODE = 0
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.99.0 --profile minimal --component rustfmt --component clippy
      - name: Windows Host storage through the Rust process boundary
        if: runner.os == 'Windows'
        run: cargo test -p caidex-host --lib --locked
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings
      - name: Protocol tests
        run: cargo test --workspace --locked
      - name: Install Linux native credential test service
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y --no-install-recommends gnome-keyring dbus-x11 libglib2.0-bin
      - name: Linux native credential store in an isolated session
        if: runner.os == 'Linux'
        run: bash scripts/test-linux-secret-service.sh
      - name: Install pinned upstream CLI
        run: npm install --prefix .tools/codex --no-audit --no-fund --ignore-scripts @openai/codex@0.160.1
      - name: Locate native Codex executable
        run: node scripts/codex-binary.mjs --github-env
      - name: Verify pinned stable and experimental schemas
        run: node scripts/verify-codex-schema.mjs
      - name: Verify real app-server without a model turn
        run: cargo run -p caidex-cli --locked -- doctor
      - name: H-1 independent Host and two-client recovery (no model turn)
        run: |
          cargo build -p caidex-host --locked
          ${{ matrix.python }} scripts/h1-demo.py
      - name: H-2 persistent tasks and real native execution (local synthetic model)
        run: ${{ matrix.python }} scripts/h2-demo.py
      - name: H-3 delegated approvals, native Diff/Review and recovery (local synthetic model)
        run: ${{ matrix.python }} scripts/h3-demo.py
      - name: Real Runtime with local Responses fixtures
        run: cargo test -p caidex-runtime --test real_runtime --locked -- --ignored
